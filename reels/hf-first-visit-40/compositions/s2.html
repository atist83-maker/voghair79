<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s2-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

      </style>
      <div id="s2-root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-fade" class="fade">
          <img id="s2-img" class="photo" src="assets/photos/4.jpg" alt="" />
          <div class="shade"></div>
          <div class="copy">
            <div id="s2-eyebrow" class="eyebrow"><span class="bar"></span><span class="kr">FIRST VISIT</span></div>
            <h1 id="s2-head" class="headline">처음 오시는 분께<br /><em>특별한 혜택</em></h1>
          </div>
        </div>
      </div>
      <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s2-fade", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0.0);
      tl.fromTo("#s2-img", { scale: 1.16, xPercent: 3 }, { scale: 1.1, xPercent: -3, duration: 3.4, ease: "none" }, 0.0);
      tl.fromTo("#s2-eyebrow", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.fromTo("#s2-head", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5);
        window.__timelines["s2"] = tl;
      })();
      </script>
    </template>
  </body>
</html>
